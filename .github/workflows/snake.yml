name: contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#39c5bb&color_dots=#ebedf0,#b9e8e3,#7fd6cd,#39c5bb,#2a9d95
            dist/snake-dark.svg?palette=github-dark&color_snake=#d9a24a&color_dots=#161b22,#12302e,#1f5752,#2a9d95,#39c5bb

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
